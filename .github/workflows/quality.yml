name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate foundation authority and provenance
        run: npm run validate:foundation
      - name: Validate Spec architecture and taxonomy
        run: npm run validate:spec
      - name: Build Foundry artifact
        run: npm run build:foundry
      - name: Verify expected deployable files
        run: |
          test -f dist/foundry/index.html
          test -f dist/foundry/styles.css
          test "$(cat dist/foundry/CNAME)" = "neosmartui.com"
