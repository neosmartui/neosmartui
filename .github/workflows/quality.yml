name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEOSMARTUI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NEOSMARTUI_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate foundation authority and provenance
        run: npm run validate:foundation
      - name: Validate Spec architecture and taxonomy
        run: npm run validate:spec
      - name: Validate schemas and stable IDs
        run: npm run validate:schemas
      - name: Validate migration snapshots and provenance
        run: npm run validate:migration
      - name: Validate Core semantic token contracts
        run: npm run validate:tokens
      - name: Validate Core component registry
        run: npm run validate:components
      - name: Validate Flavor, Theme, and adapter resolution
        run: npm run validate:resolution
      - name: Validate public-proof evidence structure
        run: npm run validate:proof
      - name: Verify claimed public proof against live HTTPS endpoints
        run: npm run validate:proof:live
      - name: Build Foundry artifact
        run: npm run build:foundry
      - name: Verify expected deployable files
        run: |
          test -f dist/foundry/index.html
          test -f dist/foundry/styles.css
          test -f dist/foundry/theme.css
          test -f dist/foundry/button.css
          test -f dist/foundry/checkbox.css
          test -f dist/foundry/checkbox.mjs
          test -f dist/foundry/input.css
          test -f dist/foundry/input.mjs
          test -f dist/foundry/radio.css
          test -f dist/foundry/radio.mjs
          test -f dist/foundry/switch.css
          test -f dist/foundry/switch.mjs
          test -f dist/foundry/tabs.css
          test -f dist/foundry/tabs.mjs
          test -f dist/foundry/textarea.css
          test -f dist/foundry/textarea.mjs
          test -f dist/foundry/select.css
          test -f dist/foundry/select.mjs
          test -f dist/foundry/card.css
          test ! -e dist/foundry/card.mjs
          test -f dist/foundry/badge.css
          test ! -e dist/foundry/badge.mjs
          test -f dist/foundry/alert.css
          test ! -e dist/foundry/alert.mjs
          test -f dist/foundry/field.css
          test ! -e dist/foundry/field.mjs
          test -f dist/foundry/breadcrumb.css
          test ! -e dist/foundry/breadcrumb.mjs
          test -f dist/foundry/pagination.css
          test ! -e dist/foundry/pagination.mjs
          test -f dist/foundry/deployment.json
          test ! -e dist/foundry/CNAME
          grep -q -- "--ns-depth-hover-y: 3px;" dist/foundry/theme.css
          grep -q -- "--ns-color-surface-interactive: #ffffff;" dist/foundry/theme.css
          grep -q -- "--ns-color-surface-panel: #ffffff;" dist/foundry/theme.css
          grep -q -- "--ns-motion-standard-duration: 160ms;" dist/foundry/theme.css
          grep -q -- "--ns-font-size-body: 1rem;" dist/foundry/theme.css
          grep -q -- "--ns-font-size-label: 1rem;" dist/foundry/theme.css
          grep -q -- "--ns-font-weight-emphasis: 750;" dist/foundry/theme.css
          grep -q -- "--ns-space-field-gap: clamp(0.5rem, 0.44rem + 0.18vw, 0.6875rem);" dist/foundry/theme.css
          grep -q -- "--ns-space-navigation-gap: 0.45rem;" dist/foundry/theme.css
          grep -q -- "--ns-font-size-navigation: clamp(0.72rem, 0.69rem + 0.08vw, 0.78rem);" dist/foundry/theme.css
          grep -q -- "--ns-space-surface-inline: 1rem;" dist/foundry/theme.css
          grep -q -- "--ns-space-surface-block: 1rem;" dist/foundry/theme.css
          grep -q -- "--ns-border-surface-width: 3px;" dist/foundry/theme.css
          grep -q -- "--ns-radius-surface: 6px;" dist/foundry/theme.css
          grep -q -- "--ns-font-weight-strong: 800;" dist/foundry/theme.css
          grep -q -- "--ns-color-content-inverse: #ffffff;" dist/foundry/theme.css
          grep -q -- "--ns-color-state-info: #c9b7ff;" dist/foundry/theme.css
          grep -q -- "--ns-color-state-success: #9be3bd;" dist/foundry/theme.css
          grep -q -- "--ns-color-state-warning: #f4dc78;" dist/foundry/theme.css
          grep -q -- "--ns-space-annotation-inline: 0.55rem;" dist/foundry/theme.css
          grep -q -- "--ns-space-annotation-block: 0.15rem;" dist/foundry/theme.css
          grep -q -- "--ns-border-annotation-width: 2px;" dist/foundry/theme.css
          grep -q -- "--ns-radius-annotation: 999px;" dist/foundry/theme.css
          grep -q "Pressure, not levitation" dist/foundry/index.html
          grep -q "core.checkbox" dist/foundry/index.html
          grep -q "core.input" dist/foundry/index.html
          grep -q "core.radio" dist/foundry/index.html
          grep -q "core.switch" dist/foundry/index.html
          grep -q "Toggle immediate binary setting" dist/foundry/index.html
          grep -q "core.tabs" dist/foundry/index.html
          grep -q "Automatic horizontal activation" dist/foundry/index.html
          grep -q "Manual vertical activation" dist/foundry/index.html
          grep -q "core.textarea" dist/foundry/index.html
          grep -q "Multiline native textarea" dist/foundry/index.html
          grep -q "core.select" dist/foundry/index.html
          grep -q "Native single-select choice" dist/foundry/index.html
          grep -q "core.card" dist/foundry/index.html
          grep -q "Stable informational surface" dist/foundry/index.html
          grep -q "Grouped content, not a disguised button" dist/foundry/index.html
          grep -q "core.badge" dist/foundry/index.html
          grep -q "Info · Reference" dist/foundry/index.html
          grep -q "Success · Ready" dist/foundry/index.html
          grep -q "Warning · Needs attention" dist/foundry/index.html
          grep -q "Error · Failed" dist/foundry/index.html
          grep -q "core.alert" dist/foundry/index.html
          grep -q "Alert tone examples" dist/foundry/index.html
          grep -q "Neutral · Note" dist/foundry/index.html
          grep -q "Info · Update" dist/foundry/index.html
          grep -q "Success · Complete" dist/foundry/index.html
          grep -q "Warning · Check this" dist/foundry/index.html
          grep -q "Error · Needs correction" dist/foundry/index.html
          grep -q "Static message surface; no implicit live region." dist/foundry/index.html
          grep -q "core.field" dist/foundry/index.html
          grep -q "Email address" dist/foundry/index.html
          grep -q "This invite code has expired. Request a new code." dist/foundry/index.html
          grep -q "The disabled state belongs to the real control, not the Field container." dist/foundry/index.html
          grep -q "core.breadcrumb" dist/foundry/index.html
          grep -q "Ancestor locations stay native links" dist/foundry/index.html
          grep -q 'aria-current="page"' dist/foundry/index.html
          grep -q "core.pagination" dist/foundry/index.html
          grep -q "Page 3 of 8 is current" dist/foundry/index.html
          grep -q "Previous page unavailable" dist/foundry/index.html
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('dist/foundry/deployment.json','utf8')); if(d.sourceSha!==process.env.NEOSMARTUI_SOURCE_SHA) throw new Error('deployment source SHA mismatch')"

  browser:
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NEOSMARTUI_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright test runtime
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact-SHA Foundry artifact
        run: npm run build:foundry
      - name: Run Foundry browser QA
        run: npm run test:browser
      - name: Upload browser and deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-browser-evidence-${{ env.NEOSMARTUI_SOURCE_SHA }}
          path: |
            artifacts/browser
            dist/foundry
          if-no-files-found: error
          retention-days: 14
